<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <!-- Favicons -->
    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', path='/img/favicon.png') }}"
    >

    <link
        rel="icon"
        href="{{ url_for('static', path='/img/favicon.ico') }}"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{ url_for('static', path='/img/favicon-32x32.png') }}"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{{ url_for('static', path='/img/apple-touch-icon.png') }}"
    >

    <meta
        name="theme-color"
        content="#1c304d"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', path='/css/armory.css') }}?v={{ app_version }}"
    >

    {% block head %}{% endblock %}
</head>

<body class="login-page">

    <main class="login-shell">

        <header class="login-header">
            <div class="login-brand">
                <img
                    class="login-brand-mark"
                    src="{{ url_for('static', path='/img/favicon.png') }}"
                    alt=""
                    aria-hidden="true"
                >

                <div>
                    <div class="brand-name">ARMORY LEDGER</div>
                    <div class="brand-subtitle">PERSONAL INVENTORY</div>
                </div>
            </div>

            <div class="version">v{{ app_version }}</div>
        </header>

        <section class="login-hero">

            <div class="hero-marker">PRIVATE RECORDS</div>

            <h1>
                Your collection.<br>
                <span>Documented.</span>
            </h1>

            <p class="hero-description">
                Firearms, ammunition, maintenance, documents,
                and history — kept together.
            </p>

            <div class="heritage-rule" aria-hidden="true">
                <span class="rule-blue"></span>
                <span class="rule-ivory"></span>
                <span class="rule-red"></span>
            </div>

            <a class="login-button" href="/auth/login">
                <span>Enter Armory</span>
                <span class="button-arrow">&rarr;</span>
            </a>

        </section>

        <footer class="login-footer">
            <span>PRIVATE &bull; SELF-HOSTED</span>
            <span>ARMORY LEDGER</span>
        </footer>

    </main>
<script src="{{ url_for('static', path='/js/login.js') }}?v={{ app_version }}"></script>
</body>
</html>
