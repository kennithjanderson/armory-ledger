services:

  armory-ledger:
    image: ghcr.io/kennithjanderson/armory-ledger:latest
    container_name: armory-ledger
    restart: unless-stopped

    volumes:
      - ./data/backups:/var/lib/armory/backups

    env_file:
      - .env

    environment:
      ARMORY_BACKUP_ENCRYPTION_KEY: ${ARMORY_BACKUP_ENCRYPTION_KEY:-}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - frontend
      - backend

  db:
    image: postgres:17
    container_name: armory-ledger-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

volumes:
  postgres_data:

networks:

  frontend:

  backend:
    internal: true
